name: Sync main -> develop-postgre

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'Thayllon/portal-financeiro'
    steps:
      - name: Checkout develop-postgre
        uses: actions/checkout@v4
        with:
          ref: develop-postgre
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into develop-postgre
        run: |
          git fetch origin main:main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop-postgre já contém main — nada a fazer"
            exit 0
          fi
          echo "Fazendo merge de main em develop-postgre..."
          if ! git merge origin/main --no-edit --no-ff; then
            echo "::error::Conflito ao mesclar main -> develop-postgre. Resolva manualmente."
            git merge --abort || true
            exit 1
          fi

      - name: Push develop-postgre
        run: git push origin develop-postgre

      - name: Resumo
        run: |
          echo "Sync main -> develop-postgre concluído."
          echo "Koyeb e Vercel (se conectados na branch develop-postgre) farão deploy automático."
