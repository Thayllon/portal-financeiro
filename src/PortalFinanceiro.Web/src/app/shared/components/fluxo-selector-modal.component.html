@if (visible()) {
  <app-modal
    [visible]="true"
    [title]="tipo() === 'despesa' ? 'Escolha o fluxo da despesa' : 'Escolha o fluxo da receita'"
    subtitle="Selecione com qual fluxo deseja continuar"
    [showFooter]="false"
    (visibleChange)="fechar()"
  >
    <div class="fluxo-grid">
      <button type="button" class="fluxo-card" (click)="selecionar(false)">
        <span class="fluxo-card__icon">
          <svg [lucideIcon]="tipo() === 'receita' ? 'trending-up' : 'trending-down'" [size]="28" />
        </span>
        <strong class="fluxo-card__title">{{ tipo() === 'despesa' ? 'Fluxo despesa' : 'Fluxo receita' }}</strong>
        <span class="fluxo-card__desc">Lançamento simples</span>
      </button>

      <button type="button" class="fluxo-card fluxo-card--contrato" (click)="selecionar(true)">
        <span class="fluxo-card__icon fluxo-card__icon--contrato">
          <svg lucideIcon="trending-up-down" [size]="28" />
        </span>
        <strong class="fluxo-card__title">{{ tipo() === 'despesa' ? 'Fluxo despesa (contrato)' : 'Fluxo receita (contrato)' }}</strong>
        <span class="fluxo-card__desc">Com cliente, parceria e categoria de serviço</span>
      </button>
    </div>
  </app-modal>
}
