<div class="cs" [class.cs--open]="isOpen()" [class.cs--up]="openUp()" [class.cs--disabled]="isDisabled()">
  @if (label()) {
    <label class="cs__label">{{ label() }}</label>
  }
  <button
    type="button"
    class="cs__trigger"
    [class.cs__trigger--placeholder]="!selectedLabel()"
    (click)="toggle()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-haspopup]="'listbox'"
    [disabled]="isDisabled()"
  >
    <span class="cs__trigger-text">{{ selectedLabel() || placeholder() }}</span>
    <svg lucideIcon="chevron-down" class="cs__chevron" [size]="16" [class.cs__chevron--open]="isOpen()" />
  </button>
  @if (isOpen()) {
    <div class="cs__dropdown" role="listbox">
      @if (showSearch()) {
        <div class="cs__search" (click)="$event.stopPropagation()">
          <svg lucideIcon="search" [size]="14" class="cs__search-icon" />
          <input
            type="text"
            class="cs__search-input"
            [placeholder]="searchPlaceholder()"
            [ngModel]="searchTerm()"
            (ngModelChange)="searchTerm.set($event)"
            (click)="$event.stopPropagation()"
            (keydown)="$event.stopPropagation()"
            autocomplete="off"
          />
        </div>
      }
      @for (opt of filteredOptions(); track opt.value) {
        <button
          type="button"
          class="cs__option"
          [class.cs__option--selected]="opt.value === internalValue()"
          (click)="select(opt)"
          [attr.role]="'option'"
          [attr.aria-selected]="opt.value === internalValue()"
        >
          {{ opt.label }}
        </button>
      }
      @if (filteredOptions().length === 0) {
        <div class="cs__empty">{{ options().length === 0 ? 'Nenhuma opção' : 'Nenhum resultado' }}</div>
      }
    </div>
  }
</div>
