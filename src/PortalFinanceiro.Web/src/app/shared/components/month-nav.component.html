<div class="month-nav">
  <button class="nav-btn" [attr.aria-label]="rotuloAnterior()" (click)="prev.emit()">
    <svg lucideIcon="chevron-left" [size]="16" />
  </button>
  @if (somenteAno()) {
    <span class="month-label">{{ ano() }}</span>
  } @else {
    <span class="month-label">{{ (mes() < 10 ? '0' : '') + mes() }}/{{ ano() }}</span>
  }
  <button class="nav-btn" [attr.aria-label]="rotuloProximo()" (click)="next.emit()">
    <svg lucideIcon="chevron-right" [size]="16" />
  </button>
</div>
